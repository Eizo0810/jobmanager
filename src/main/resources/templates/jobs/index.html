<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>求人一覧</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h1 class="mb-4">求人一覧</h1>

    <p>
        <a class="btn btn-primary" th:href="@{/jobs/new}">求人登録</a>
    </p>

	<form th:action="@{/jobs}" method="get" class="mb-3">
	    <div class="row g-2">
	        <div class="col-md-3">
	            <input type="text"
	                   name="companyName"
	                   th:value="${companyName}"
	                   class="form-control"
	                   placeholder="企業名">
	        </div>

	        <div class="col-md-3">
	            <input type="text"
	                   name="jobTitle"
	                   th:value="${jobTitle}"
	                   class="form-control"
	                   placeholder="職種">
	        </div>

	        <div class="col-md-3">
	            <input type="text"
	                   name="location"
	                   th:value="${location}"
	                   class="form-control"
	                   placeholder="勤務地">
	        </div>

	        <div class="col-md-3">
	            <button type="submit" class="btn btn-outline-primary">
	                検索
	            </button>

	            <a th:href="@{/jobs}" class="btn btn-outline-secondary">
	                クリア
	            </a>
	        </div>
	    </div>
		
		<div class="col-md-3">
		    <select name="sort" class="form-select">
		        <option value="id" th:selected="${sort == 'id'}">ID順</option>
		        <option value="companyName" th:selected="${sort == 'companyName'}">企業名順</option>
		        <option value="jobTitle" th:selected="${sort == 'jobTitle'}">職種順</option>
		        <option value="location" th:selected="${sort == 'location'}">勤務地順</option>
		    </select>
		</div>
	</form>

    <table class="table table-striped table-bordered">
		<tr>
		    <th>ID</th>
		    <th>企業名</th>
		    <th>職種</th>
		    <th>勤務地</th>
		    <th>雇用形態</th>
		    <th>給与</th>
			<th>詳細</th>
			<th>編集</th>
			<th>削除</th>
		</tr>

		<tr th:each="job : ${jobs}">
		    <td th:text="${job.id}"></td>
		    <td th:text="${job.companyName}"></td>
		    <td th:text="${job.jobTitle}"></td>
		    <td th:text="${job.location}"></td>
		    <td th:text="${job.employmentType}"></td>
		    <td th:text="${job.salary}"></td>
			<td>
				<a class="btn btn-sm btn-outline-secondary"
				   th:href="@{/jobs/{id}(id=${job.id})}">
				    詳細
				</a>
			</td>
			<td>
				<a class="btn btn-warning"
				   th:href="@{/jobs/{id}/edit(id=${job.id})}">
				    編集
				</a>
			</td>
			<td>
				<form th:action="@{/jobs/{id}/delete(id=${job.id})}"
				      method="post">

				    <button type="submit"
				            class="btn btn-danger"
				            onclick="return confirm('本当に削除しますか？');">
				        削除
				    </button>

				</form>
			</td>
		</tr>
    </table>

	<nav th:if="${jobPage.totalPages > 1}">
	    <ul class="pagination">
	        <li class="page-item" th:classappend="${jobPage.first} ? 'disabled'">
	            <a class="page-link"
	               th:href="@{/jobs(page=${jobPage.number - 1}, companyName=${companyName}, jobTitle=${jobTitle}, location=${location})}">
	                前へ
	            </a>
	        </li>

	        <li class="page-item"
	            th:each="i : ${#numbers.sequence(0, jobPage.totalPages - 1)}"
	            th:classappend="${i == jobPage.number} ? 'active'">
	            <a class="page-link"
	               th:href="@{/jobs(page=${i}, companyName=${companyName}, jobTitle=${jobTitle}, location=${location}, sort=${sort})}"
	               th:text="${i + 1}">
	            </a>
	        </li>

	        <li class="page-item" th:classappend="${jobPage.last} ? 'disabled'">
	            <a class="page-link"
	               th:href="@{/jobs(page=${jobPage.number + 1}, companyName=${companyName}, jobTitle=${jobTitle}, location=${location}, sort=${sort})}">
	                次へ
	            </a>
	        </li>
	    </ul>
	</nav>
</div>
</body>
</html>
